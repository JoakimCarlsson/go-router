<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSE Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .streams { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .stream { background: #f5f5f5; padding: 15px; border-radius: 8px; }
        .events { background: white; border: 1px solid #ddd; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .event { padding: 5px; border-bottom: 1px solid #eee; }
        button { padding: 8px 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>SSE Demo</h1>
    <div class="streams">
        <div class="stream">
            <h3>Time Stream</h3>
            <div class="events" id="time-events"></div>
            <button onclick="toggleStream('time', '/events/time')">Connect</button>
        </div>
        <div class="stream">
            <h3>Messages</h3>
            <div class="events" id="messages-events"></div>
            <button onclick="toggleStream('messages', '/events/messages')">Connect</button>
        </div>
        <div class="stream">
            <h3>Counter (Manual)</h3>
            <div class="events" id="manual-events"></div>
            <button onclick="toggleStream('manual', '/events/manual')">Connect</button>
        </div>
    </div>
    <script>
        const sources = {};
        function toggleStream(name, url) {
            const btn = event.target;
            if (sources[name]) {
                sources[name].close();
                sources[name] = null;
                btn.textContent = 'Connect';
            } else {
                sources[name] = new EventSource(url);
                sources[name].onmessage = e => addEvent(name, e.data);
                ['time', 'message', 'counter'].forEach(t => {
                    sources[name].addEventListener(t, e => addEvent(name, e.data));
                });
                btn.textContent = 'Disconnect';
            }
        }
        function addEvent(name, data) {
            const el = document.getElementById(name + '-events');
            const div = document.createElement('div');
            div.className = 'event';
            div.textContent = data;
            el.insertBefore(div, el.firstChild);
            while (el.children.length > 15) el.removeChild(el.lastChild);
        }
    </script>
</body>
</html>
