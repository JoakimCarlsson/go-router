name: Release

on:
  push:
    tags:
      - "router/v*"
      - "openapi/v*"
      - "swaggerui/v*"
      - "outputcache/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Extract module and version
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "module=$MODULE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get previous tag for module
        id: previous
        run: |
          MODULE="${{ steps.extract.outputs.module }}"
          CURRENT_TAG="${{ steps.extract.outputs.tag }}"
          PREVIOUS_TAG=$(git tag -l "${MODULE}/v*" --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n1 || true)
          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: notes
        run: |
          MODULE="${{ steps.extract.outputs.module }}"
          VERSION="${{ steps.extract.outputs.version }}"
          PREVIOUS="${{ steps.previous.outputs.tag }}"
          
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..HEAD"
          else
            RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          fi
          
          echo "## What's Changed" > notes.md
          echo "" >> notes.md
          
          git log $RANGE --oneline --no-merges -- "${MODULE}/" | while read -r line; do
            echo "- $line" >> notes.md
          done
          
          if [ ! -s notes.md ] || [ $(wc -l < notes.md) -le 2 ]; then
            echo "## What's Changed" > notes.md
            echo "" >> notes.md
            echo "Initial release of ${MODULE} module" >> notes.md
          fi
          
          cat notes.md
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          MODULE="${{ steps.extract.outputs.module }}"
          VERSION="${{ steps.extract.outputs.version }}"
          TITLE="${MODULE} ${VERSION}"
          
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file notes.md
      
      - name: Trigger Go module reindex (pkg.go.dev)
        run: |
          MODULE="${{ steps.extract.outputs.module }}"
          VERSION="${{ steps.extract.outputs.version }}"
          curl -sS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/${MODULE}/@v/${VERSION}.info" || true
