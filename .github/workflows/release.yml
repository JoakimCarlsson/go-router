name: Release

on:
  push:
    tags:
      - "router/v*"
      - "openapi/v*"
      - "swaggerui/v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Extract module and version
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "module=$MODULE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $MODULE version $VERSION"
      
      - name: Trigger Go module reindex (pkg.go.dev)
        run: |
          MODULE="${{ steps.extract.outputs.module }}"
          VERSION="${{ steps.extract.outputs.version }}"
          echo "Triggering Go module reindex at proxy.golang.org for $MODULE@$VERSION"
          curl -sSf "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/${MODULE}/@v/${VERSION}.info"
