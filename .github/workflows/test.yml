name: Run Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --verbose
          working-directory: router
      - name: Lint openapi module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --verbose
          working-directory: openapi
      - name: Lint swaggerui module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --verbose
          working-directory: swaggerui

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            go-build: ~/.cache/go-build
          - os: macos-latest
            go-build: ~/Library/Caches/go-build
          - os: windows-latest
            go-build: ~\\AppData\\Local\\go-build
    name: ${{ matrix.os }} @ Go 1.22
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.go-build }}
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Tests - router
        run: go test -v ./...
        working-directory: router

      - name: Run Tests - openapi
        run: go test -v ./...
        working-directory: openapi

      - name: Run Tests - swaggerui
        run: go test -v ./...
        working-directory: swaggerui

      - name: Run Race Tests - router
        run: go test -v -race ./...
        working-directory: router

      - name: Run Race Tests - openapi
        run: go test -v -race ./...
        working-directory: openapi

      - name: Run Race Tests - swaggerui
        run: go test -v -race ./...
        working-directory: swaggerui

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      
      - name: Run Tests with Coverage - router
        run: go test -v -coverprofile=coverage-router.out ./...
        working-directory: router
      
      - name: Run Tests with Coverage - openapi
        run: go test -v -coverprofile=coverage-openapi.out ./...
        working-directory: openapi
      
      - name: Run Tests with Coverage - swaggerui
        run: go test -v -coverprofile=coverage-swaggerui.out ./...
        working-directory: swaggerui
      
      - name: Merge coverage files
        run: |
          cat router/coverage-router.out > coverage.out
          tail -n +2 openapi/coverage-openapi.out >> coverage.out
          tail -n +2 swaggerui/coverage-swaggerui.out >> coverage.out
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: coverage
